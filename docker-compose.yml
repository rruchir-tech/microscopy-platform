services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: microscopy
      POSTGRES_PASSWORD: microscopy
      POSTGRES_DB: microscopy
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microscopy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://microscopy:microscopy@postgres:5432/microscopy
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      UPLOAD_FOLDER: /data/uploads
      RESULTS_FOLDER: /data/results
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://microscopy:microscopy@postgres:5432/microscopy
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
      UPLOAD_FOLDER: /data/uploads
      RESULTS_FOLDER: /data/results
    volumes:
      - appdata:/data
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  appdata:
